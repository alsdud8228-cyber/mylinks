<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>인증 코드</title>
<style>body{font-family:-apple-system,system-ui,sans-serif;background:#111;color:#eee;
display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;padding:24px}
.box{max-width:560px;width:100%;text-align:center}code{display:block;word-break:break-all;
background:#222;border:1px solid #444;border-radius:10px;padding:16px;margin:16px 0;font-size:14px}
h1{font-size:20px}p{color:#aaa;font-size:14px}</style></head><body>
<div class="box"><h1>인증 코드</h1>
<code id="c">코드를 찾는 중…</code>
<p>이 코드를 세션에 알려주세요. 코드는 몇 분 내 만료됩니다.</p></div>
<script>
const p = new URLSearchParams(location.search);
const code = p.get('code'), err = p.get('error_description') || p.get('error');
document.getElementById('c').textContent = code ? code : (err ? ('오류: ' + err) : '코드 없음');
</script></body></html>
